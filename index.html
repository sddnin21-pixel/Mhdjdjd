  updateBadges();

  if (!state.trash.length) {
    wrap.innerHTML = `<div class="hero" style="padding-bottom:18px"><h1 style="font-size:clamp(22px,5vw,34px)">Thùng rác</h1><p>Các mục đã xoá sẽ lưu ở đây trong 7 ngày.</p></div>
      <div class="empty">
        <span class="empty-emoji">🗑️</span>
        <h3>Thùng rác trống</h3>
        <p>Chưa có gì bị xoá cả.</p>
        <button class="btn btn-ghost" onclick="go('decks')">Về trang chủ</button>
      </div>`;
    return;
  }

  wrap.innerHTML = `
    <div class="hero" style="padding-bottom:18px">
      <h1 style="font-size:clamp(22px,5vw,34px)">Thùng rác</h1>
      <p>Mục bị xoá sẽ tự động biến mất sau 7 ngày. Khôi phục bất cứ lúc nào.</p>
    </div>
    <div class="section-head">
      <h2>🗑️ Đã xoá <span class="count-pill">${state.trash.length}</span></h2>
      <div class="spacer"></div>
      <button class="btn btn-danger sm" id="emptyTrashBtn">Xoá tất cả</button>
    </div>
    <div class="trash-list">
      ${state.trash.map((t, i) => {
        const ago = Math.round((now - t.deletedAt) / 3600000);
        const agoText = ago < 1 ? 'vừa xong' : ago < 24 ? `${ago} giờ trước` : `${Math.floor(ago / 24)} ngày trước`;
        if (t.type === 'deck') {
          return `<div class="trash-item" data-i="${i}">
            <div class="ico">${esc(t.data.icon || '📘')}</div>
            <div class="info">
              <div class="name">${esc(t.data.name)}</div>
              <div class="meta">Bộ thẻ · ${t.data.cards.length} thẻ · ${agoText}</div>
            </div>
            <div class="actions">
              <button class="btn btn-success sm" data-act="restore" type="button">Khôi phục</button>
              <button class="btn btn-danger sm" data-act="purge" type="button">Xoá</button>
            </div>
          </div>`;
        } else {
          return `<div class="trash-item" data-i="${i}">
            <div class="ico">🃏</div>
            <div class="info">
              <div class="name">${esc(t.data.front)}</div>
              <div class="meta">Thẻ từ "${esc(t.deckName || 'Không rõ')}" · ${agoText}</div>
            </div>
            <div class="actions">
              <button class="btn btn-success sm" data-act="restore" type="button">Khôi phục</button>
              <button class="btn btn-danger sm" data-act="purge" type="button">Xoá</button>
            </div>
          </div>`;
        }
      }).join('')}
    </div>
  `;

  wrap.querySelectorAll('.trash-item').forEach(el => {
    el.querySelectorAll('[data-act]').forEach(btn => {
      btn.addEventListener('click', () => {
        const i = +el.dataset.i;
        const t = state.trash[i];
        if (!t) return;
        if (btn.dataset.act === 'restore') {
          if (t.type === 'deck') {
            state.decks.unshift(t.data);
            toast('Đã khôi phục bộ thẻ!', 'success');
          } else {
            const deck = getDeck(t.deckId);
            if (deck) { deck.cards.push(t.data); toast('Đã khôi phục thẻ!', 'success'); }
            else toast('Bộ thẻ gốc không còn', 'error');
          }
          state.trash.splice(i, 1);
          save(); renderTrash(); renderDecks(); updateBadges();
          beep(780, .1, 'triangle', .05);
        } else {
          state.trash.splice(i, 1);
          save(); renderTrash(); updateBadges();
          toast('Đã xoá vĩnh viễn', 'info'); beep(240, .14, 'sawtooth', .04);
        }
      });
    });
  });

  const eb = $('#emptyTrashBtn');
  if (eb) eb.addEventListener('click', () => {
    if (!confirm(`Xoá vĩnh viễn ${state.trash.length} mục?`)) return;
    state.trash = []; save(); renderTrash(); updateBadges();
    toast('Đã dọn sạch thùng rác', 'info');
  });
}

/* ============ IMPORT / EXPORT ============ */
function exportDeck(deck) {
  const data = JSON.stringify({ qusin: true, version: 1, deck }, null, 2);
  const blob = new Blob([data], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = deck.name.replace(/[^\w\d\s\u00C0-\u024F\u1E00-\u1EFF-]/g, '_') + '.qusin.json';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
  toast('Đã xuất file JSON! 📤', 'success'); beep(780, .1, 'triangle', .05);
}

function shareDeck(deck) {
  const data = JSON.stringify({ qusin: true, version: 1, deck });
  const encoded = btoa(unescape(encodeURIComponent(data)));
  const url = location.origin + location.pathname + '#deck=' + encoded;
  if (url.length > 8000) {
    navigator.clipboard.writeText(data).then(() => {
      toast('Link quá dài — đã copy JSON!', 'warn');
    }).catch(() => toast('Không copy được', 'error'));
    return;
  }
  navigator.clipboard.writeText(url).then(() => {
    toast('Đã copy link chia sẻ! 🔗', 'success'); beep(880, .1, 'triangle', .05);
  }).catch(() => {
    openModal(`<h3>🔗 Link chia sẻ</h3><p class="desc">Copy link dưới đây:</p>
      <textarea class="textarea" readonly style="font-size:11px">${esc(url)}</textarea>
      <div class="modal-actions"><button class="btn btn-primary" onclick="closeModal()">Đóng</button></div>`);
  });
}

function checkShareURL() {
  const hash = location.hash;
  if (!hash.startsWith('#deck=')) return;
  try {
    const data = decodeURIComponent(escape(atob(hash.slice(6))));
    const parsed = JSON.parse(data);
    const deck = parsed.deck || parsed;
    if (!deck || !deck.name || !Array.isArray(deck.cards)) throw new Error('invalid');
    openModal(`
      <h3>🔗 Bộ thẻ được chia sẻ</h3>
      <p class="desc">Ai đó muốn chia sẻ bộ thẻ với bạn:</p>
      <div style="padding:14px;border-radius:14px;background:var(--surface);border:1px solid var(--border);margin-bottom:18px">
        <div style="display:flex;align-items:center;gap:12px">
          <div style="font-size:26px">${esc(deck.icon || '📘')}</div>
          <div style="min-width:0">
            <div style="font-weight:700;font-size:15px;word-break:break-word">${esc(deck.name)}</div>
            <div style="font-size:12px;color:var(--text-dim);margin-top:2px">${deck.cards.length} thẻ · ${esc(deck.desc || 'Không có mô tả')}</div>
          </div>
        </div>
      </div>
      <div class="modal-actions">
        <button class="btn btn-ghost" onclick="closeModal();location.hash=''" type="button">Bỏ qua</button>
        <button class="btn btn-primary" id="addShared" type="button">Thêm</button>
      </div>`, ov => {
      ov.querySelector('#addShared').addEventListener('click', () => {
        const newDeck = {
          id: uid(), name: deck.name, desc: deck.desc || '', icon: deck.icon || '📘',
          color: deck.color || 0, created: Date.now(),
          cards: (deck.cards || []).map(c => ({
            id: uid(), front: c.front, back: c.back, starred: false, level: 0, correct: 0, wrong: 0, reviewed: 0, lastReviewed: 0
          }))
        };
        state.decks.unshift(newDeck);
        save(); closeModal(); go('decks');
        history.replaceState(null, '', location.pathname);
        toast('Đã thêm bộ thẻ! 🎉', 'success'); burstConfetti(80);
      });
    });
  } catch (e) { console.warn(e); location.hash = ''; }
}

$('#importBtn').addEventListener('click', () => {
  openModal(`
    <h3>📥 Nhập bộ thẻ</h3>
    <div class="tabs" id="importTabs">
      <button class="active" data-tab="file" type="button">Từ file</button>
      <button data-tab="paste" type="button">Dán nhanh</button>
      <button data-tab="json" type="button">Dán JSON</button>
    </div>
    <div id="importTabContent"></div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal()" type="button">Đóng</button>
    </div>`, ov => {
    const content = ov.querySelector('#importTabContent');
    const renderTab = (tab) => {
      if (tab === 'file') {
        content.innerHTML = `
          <p class="desc">Chọn file <strong>.json</strong>, <strong>.csv</strong> hoặc <strong>.txt</strong> (mỗi dòng: <code>mặt trước | mặt sau</code>).</p>
          <button class="btn btn-primary" id="pickFile" style="width:100%" type="button">📁 Chọn file</button>`;
        content.querySelector('#pickFile').addEventListener('click', () => {
          closeModal();
          setTimeout(() => $('#fileInput').click(), 200);
        });
      } else if (tab === 'paste') {
        content.innerHTML = `
          <p class="desc">Dán nội dung, mỗi dòng 1 thẻ. Phân tách bằng dấu <code>|</code>.</p>
          <div class="field"><label>Tên bộ thẻ</label><input class="input" id="pName" placeholder="Bộ thẻ mới" value="Bộ thẻ nhập"></div>
          <div class="field"><label>Nội dung</label><textarea class="textarea" id="pText" placeholder="Hello | Xin chào&#10;Book | Quyển sách" style="min-height:140px;font-family:monospace;font-size:13px"></textarea></div>
          <button class="btn btn-primary" id="doPaste" style="width:100%" type="button">Nhập</button>`;
        content.querySelector('#doPaste').addEventListener('click', () => {
          const name = content.querySelector('#pName').value.trim() || 'Bộ thẻ nhập';
          const text = content.querySelector('#pText').value.trim();
          if (!text) { toast('Chưa có nội dung!', 'error'); return; }
          const cards = [];
          text.split('\n').forEach(line => {
            line = line.trim();
            if (!line) return;
            const parts = line.split('|').map(s => s.trim());
            if (parts.length >= 2 && parts[0] && parts[1]) {
              cards.push({ id: uid(), front: parts[0], back: parts.slice(1).join(' | '), starred: false, level: 0, correct: 0, wrong: 0, reviewed: 0, lastReviewed: 0 });
            }
          });
          if (!cards.length) { toast('Không có thẻ hợp lệ!', 'error'); return; }
          state.decks.unshift({ id: uid(), name, desc: 'Nhập từ văn bản', icon: '📥', color: 4, created: Date.now(), cards });
          save(); closeModal(); go('decks'); updateBadges();
          toast(`Đã nhập ${cards.length} thẻ! 🎉`, 'success');
          burstConfetti(80); chord([660, 880, 1100], .12, .07);
        });
      } else {
        content.innerHTML = `
          <p class="desc">Dán nội dung JSON của bộ thẻ.</p>
          <div class="field"><textarea class="textarea" id="jText" placeholder='{"qusin":true,"deck":{...}}' style="min-height:140px;font-family:monospace;font-size:12px"></textarea></div>
          <button class="btn btn-primary" id="doJson" style="width:100%" type="button">Nhập JSON</button>`;
        content.querySelector('#doJson').addEventListener('click', () => {
          try {
            const raw = content.querySelector('#jText').value.trim();
            const parsed = JSON.parse(raw);
            const deck = parsed.deck || parsed;
            if (!deck.name || !Array.isArray(deck.cards)) throw new Error('bad');
            deck.id = uid();
            deck.cards = deck.cards.map(c => ({
              id: uid(), front: c.front || '', back: c.back || '', starred: false,
              level: 0, correct: 0, wrong: 0, reviewed: 0, lastReviewed: 0
            }));
            state.decks.unshift(deck);
            save(); closeModal(); go('decks'); updateBadges();
            toast(`Đã nhập "${deck.name}"! 🎉`, 'success'); burstConfetti(80);
          } catch(e) { toast('JSON không hợp lệ!', 'error'); }
        });
      }
    };
    renderTab('file');
    ov.querySelectorAll('#importTabs button').forEach(b => {
      b.addEventListener('click', () => {
        ov.querySelectorAll('#importTabs button').forEach(x => x.classList.remove('active'));
        b.classList.add('active');
        renderTab(b.dataset.tab);
      });
    });
  });
});

$('#fileInput').addEventListener('change', e => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    const text = ev.target.result;
    const name = file.name.replace(/\.(json|csv|txt|qusin)$/i, '').replace(/\..+$/, '');
    try {
      if (file.name.endsWith('.json') || text.trim().startsWith('{')) {
        const parsed = JSON.parse(text);
        const deck = parsed.deck || parsed;
        if (!deck.name || !Array.isArray(deck.cards)) throw new Error('invalid');
        deck.id = uid();
        deck.cards = deck.cards.map(c => ({
          id: uid(), front: c.front || '', back: c.back || '', starred: false,
          level: 0, correct: 0, wrong: 0, reviewed: 0, lastReviewed: 0
        }));
        state.decks.unshift(deck);
        toast(`Đã nhập "${deck.name}"! 🎉`, 'success');
      } else {
        const cards = [];
        text.split('\n').forEach(line => {
          line = line.trim();
          if (!line) return;
          let parts;
          if (line.includes('|')) parts = line.split('|');
          else if (line.includes('\t')) parts = line.split('\t');
          else parts = line.split(',');
          parts = parts.map(s => s.trim().replace(/^"|"$/g, ''));
          if (parts.length >= 2 && parts[0] && parts[1]) {
            cards.push({ id: uid(), front: parts[0], back: parts.slice(1).join(' '), starred: false, level: 0, correct: 0, wrong: 0, reviewed: 0, lastReviewed: 0 });
          }
        });
        if (!cards.length) { toast('Không có thẻ hợp lệ!', 'error'); return; }
        state.decks.unshift({ id: uid(), name: name || 'Bộ thẻ nhập', desc: `Nhập từ ${file.name}`, icon: '📥', color: 4, created: Date.now(), cards });
        toast(`Đã nhập ${cards.length} thẻ! 🎉`, 'success');
      }
      save(); renderDecks(); updateBadges();
      burstConfetti(80); chord([660, 880, 1100], .12, .07);
    } catch (err) {
      console.warn(err);
      toast('File không hợp lệ!', 'error');
    }
    e.target.value = '';
  };
  reader.readAsText(file);
});

/* ============ KEYBOARD ============ */
document.addEventListener('keydown', e => {
  if (document.querySelector('.overlay')) return;
  const tag = (e.target.tagName || '').toLowerCase();
  if (tag === 'input' || tag === 'textarea') return;
  const studyView = document.getElementById('view-study')?.classList.contains('active');
  if (!studyView || !session) return;
  if (e.code === 'Space') { e.preventDefault(); flipCard(); }
  else if (e.key === '1' && session.flipped) { e.preventDefault(); session.multi ? rateStudyMulti(true) : rateStudy(true); }
  else if (e.key === '2' && session.flipped) { e.preventDefault(); session.multi ? rateStudyMulti(false) : rateStudy(false); }
  else if (e.key === 'Escape') { exitStudy(); }
});

/* ============ THEME & SOUND ============ */
const sunIcon = `<circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>`;
const moonIcon = `<path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/>`;
function applyTheme() {
  document.documentElement.setAttribute('data-theme', state.settings.theme);
  $('#themeIcon').innerHTML = state.settings.theme === 'dark' ? sunIcon : moonIcon;
  const meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.setAttribute('content', state.settings.theme === 'dark' ? '#07070f' : '#f4f4fb');
}
$('#themeBtn').addEventListener('click', () => {
  state.settings.theme = state.settings.theme === 'dark' ? 'light' : 'dark';
  applyTheme(); save();
  beep(700, .08);
  toast(state.settings.theme === 'dark' ? '🌙 Chế độ tối' : '☀️ Chế độ sáng', 'info');
});
function applySound() {
  const btn = $('#soundBtn');
  btn.classList.toggle('on', state.settings.sound);
  btn.style.opacity = state.settings.sound ? '1' : '.5';
}
$('#soundBtn').addEventListener('click', () => {
  state.settings.sound = !state.settings.sound;
  applySound(); save();
  if (state.settings.sound) beep(820, .09, 'sine', .05);
  toast(state.settings.sound ? '🔊 Bật âm thanh' : '🔇 Tắt âm thanh', 'info');
});

/* ============ SEARCH ============ */
$('#searchInput').addEventListener('input', e => {
  searchQuery = e.target.value;
  renderDecks();
});

load();
applyTheme();
applySound();
renderStreak();
renderDecks();
updateBadges();
checkShareURL();

    toast('👋 Chào mừng đến với Qusin Flashcard!', 'info');

}, 700);

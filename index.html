<!DOCTYPE html>
<html lang="vi" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Qusin Flashcard ✦ Học thông minh</title>
<meta name="theme-color" content="#7c5cff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --r:18px;
  --ease:cubic-bezier(.4,0,.2,1);
  --spring:cubic-bezier(.34,1.56,.64,1);
  --safe-b:env(safe-area-inset-bottom,0px);
  --safe-t:env(safe-area-inset-top,0px);
  --safe-l:env(safe-area-inset-left,0px);
  --safe-r:env(safe-area-inset-right,0px);
  --topbar-h:60px;
  --bottomnav-h:0px;
}
:root[data-theme="dark"]{
  --bg:#07070f;--bg-2:#0e0e1c;
  --surface:rgba(255,255,255,.045);--surface-2:rgba(255,255,255,.085);--surface-3:rgba(255,255,255,.12);
  --border:rgba(255,255,255,.10);--border-2:rgba(255,255,255,.18);
  --text:#f2f2fa;--text-dim:#9292ad;--text-faint:#5d5d78;
  --primary:#7c5cff;--primary-2:#b06cff;--accent:#ff5c9d;
  --success:#2ee6a8;--danger:#ff5c7c;--warning:#ffc542;
  --shadow:0 20px 60px -15px rgba(0,0,0,.85);
  --glass:blur(24px) saturate(180%);
  --card-front:linear-gradient(145deg,rgba(124,92,255,.22),rgba(176,108,255,.08) 40%,rgba(255,255,255,.03));
  --card-back:linear-gradient(145deg,rgba(46,230,168,.20),rgba(46,230,168,.05) 40%,rgba(255,255,255,.03));
}
:root[data-theme="light"]{
  --bg:#f4f4fb;--bg-2:#ffffff;
  --surface:rgba(255,255,255,.75);--surface-2:rgba(255,255,255,.95);--surface-3:rgba(124,92,255,.09);
  --border:rgba(20,20,60,.10);--border-2:rgba(20,20,60,.18);
  --text:#14143c;--text-dim:#61618a;--text-faint:#9a9ab5;
  --primary:#6b46ff;--primary-2:#9d4dff;--accent:#ff3d86;
  --success:#00c48c;--danger:#f0435f;--warning:#e8a300;
  --shadow:0 20px 50px -18px rgba(60,40,140,.35);
  --glass:blur(24px) saturate(180%);
  --card-front:linear-gradient(145deg,rgba(124,92,255,.14),rgba(176,108,255,.05) 40%,rgba(255,255,255,.6));
  --card-back:linear-gradient(145deg,rgba(0,196,140,.14),rgba(0,196,140,.04) 40%,rgba(255,255,255,.6));
}
html,body{height:100%}
html{font-size:16px;-webkit-text-size-adjust:100%}
body{
  font-family:'Be Vietnam Pro',system-ui,-apple-system,sans-serif;
  background:var(--bg);color:var(--text);min-height:100vh;
  overflow-x:hidden;line-height:1.5;overscroll-behavior-y:none;
  transition:background .5s var(--ease),color .4s var(--ease);
  padding-bottom:calc(var(--bottomnav-h) + var(--safe-b));
}
::selection{background:var(--primary);color:#fff}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--surface-3);border-radius:99px;border:2px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:var(--primary);background-clip:content-box}

/* Background */
.bg-orbs{position:fixed;inset:0;z-index:-2;overflow:hidden;pointer-events:none}
.orb{position:absolute;border-radius:50%;filter:blur(90px);opacity:.55;will-change:transform}
:root[data-theme="light"] .orb{opacity:.35}
.orb.o1{width:min(520px,70vw);height:min(520px,70vw);background:radial-gradient(circle,#7c5cff,transparent 70%);top:-180px;left:-140px;animation:float1 22s ease-in-out infinite}
.orb.o2{width:min(460px,65vw);height:min(460px,65vw);background:radial-gradient(circle,#ff5c9d,transparent 70%);bottom:-160px;right:-120px;animation:float2 26s ease-in-out infinite}
.orb.o3{width:min(400px,60vw);height:min(400px,60vw);background:radial-gradient(circle,#2ee6a8,transparent 70%);top:40%;left:55%;animation:float3 30s ease-in-out infinite}
@keyframes float1{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(120px,80px) scale(1.15)}66%{transform:translate(60px,180px) scale(.9)}}
@keyframes float2{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(-140px,-90px) scale(1.1)}66%{transform:translate(-60px,-190px) scale(.95)}}
@keyframes float3{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(-180px,120px) scale(1.2)}}
.grid-overlay{
  position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.5;
  background-image:linear-gradient(var(--border) 1px,transparent 1px),linear-gradient(90deg,var(--border) 1px,transparent 1px);
  background-size:56px 56px;
  mask-image:radial-gradient(ellipse 80% 60% at 50% 0%,#000 20%,transparent 75%);
  -webkit-mask-image:radial-gradient(ellipse 80% 60% at 50% 0%,#000 20%,transparent 75%);
}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:9999}

/* TOPBAR */
.topbar{
  position:sticky;top:0;z-index:100;
  display:flex;align-items:center;gap:12px;
  padding:calc(10px + var(--safe-t)) max(14px,var(--safe-l)) 10px max(14px,var(--safe-r));
  padding-top:calc(10px + var(--safe-t));
  background:color-mix(in srgb,var(--bg) 78%,transparent);
  backdrop-filter:var(--glass);-webkit-backdrop-filter:var(--glass);
  border-bottom:1px solid var(--border);
  min-height:var(--topbar-h);
}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:17px;letter-spacing:-.4px;cursor:pointer;user-select:none;flex-shrink:0}
.logo-mark{
  width:36px;height:36px;border-radius:11px;
  background:linear-gradient(135deg,var(--primary),var(--accent));
  display:grid;place-items:center;font-size:18px;
  box-shadow:0 8px 24px -6px var(--primary);
  position:relative;overflow:hidden;flex-shrink:0;
  animation:logoPulse 4s ease-in-out infinite;
}
.logo-mark::after{
  content:'';position:absolute;inset:0;
  background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.6) 50%,transparent 70%);
  transform:translateX(-120%);animation:shine 3.5s ease-in-out infinite;
}
@keyframes shine{0%,60%{transform:translateX(-120%)}100%{transform:translateX(120%)}}
@keyframes logoPulse{0%,100%{box-shadow:0 8px 24px -6px var(--primary)}50%{box-shadow:0 8px 34px -4px var(--accent)}}
.logo-text{background:linear-gradient(100deg,var(--text),var(--primary-2));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;line-height:1}
.logo-text small{display:block;font-size:8.5px;font-weight:700;letter-spacing:2.5px;-webkit-text-fill-color:var(--text-faint);color:var(--text-faint);margin-top:3px}

.top-actions{margin-left:auto;display:flex;gap:6px;align-items:center;flex-shrink:0}
.streak-badge{
  display:flex;align-items:center;gap:5px;padding:6px 10px;border-radius:11px;
  background:linear-gradient(135deg,rgba(255,197,66,.2),rgba(255,92,157,.15));
  border:1px solid rgba(255,197,66,.35);
  font-size:12.5px;font-weight:800;color:var(--warning);
  cursor:help;transition:transform .3s var(--spring);
}
.streak-badge:hover{transform:scale(1.06)}
.streak-badge .flame{font-size:14px;filter:drop-shadow(0 0 5px var(--warning));animation:flicker 1.5s ease-in-out infinite}
@keyframes flicker{0%,100%{transform:scale(1) rotate(-2deg)}50%{transform:scale(1.12) rotate(2deg)}}

.icon-btn{
  width:40px;height:40px;border-radius:11px;border:1px solid var(--border);
  background:var(--surface);color:var(--text-dim);cursor:pointer;
  display:grid;place-items:center;transition:all .3s var(--spring);
  position:relative;overflow:hidden;flex-shrink:0;
}
.icon-btn:hover{color:var(--text);border-color:var(--border-2);background:var(--surface-2);transform:translateY(-2px)}
.icon-btn:active{transform:scale(.9)}
.icon-btn svg{width:18px;height:18px}
.icon-btn.on{color:var(--primary);border-color:var(--primary)}

/* DESKTOP NAV (hidden on mobile) */
.nav{display:flex;gap:4px;margin-left:10px;background:var(--surface);border:1px solid var(--border);padding:4px;border-radius:13px}
.nav button{
  border:0;background:transparent;color:var(--text-dim);font-family:inherit;
  font-size:13px;font-weight:600;padding:8px 14px;border-radius:9px;cursor:pointer;
  display:flex;align-items:center;gap:6px;transition:all .3s var(--ease);white-space:nowrap;
}
.nav button:hover{color:var(--text);background:var(--surface-2)}
.nav button.active{color:#fff;background:linear-gradient(135deg,var(--primary),var(--primary-2));box-shadow:0 6px 18px -6px var(--primary)}
.nav button svg{width:14px;height:14px}
.nav .badge-mini{
  font-size:9.5px;font-weight:800;background:var(--danger);color:#fff;
  padding:1px 5px;border-radius:99px;min-width:16px;text-align:center;
}
.nav button.active .badge-mini{background:rgba(255,255,255,.3)}

/* BOTTOM NAV (mobile only) */
.bottom-nav{
  display:none;
  position:fixed;bottom:0;left:0;right:0;z-index:200;
  background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);
  border-top:1px solid var(--border);
  padding:8px max(8px,var(--safe-l)) calc(8px + var(--safe-b)) max(8px,var(--safe-r));
  grid-template-columns:repeat(4,1fr);
  gap:4px;
}
.bottom-nav button{
  border:0;background:transparent;color:var(--text-dim);
  font-family:inherit;font-size:10.5px;font-weight:600;
  padding:8px 4px;border-radius:12px;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:4px;
  transition:all .3s var(--ease);position:relative;
  min-height:56px;justify-content:center;
}
.bottom-nav button svg{width:22px;height:22px;transition:transform .3s var(--spring)}
.bottom-nav button:active svg{transform:scale(.85)}
.bottom-nav button.active{color:var(--primary);background:color-mix(in srgb,var(--primary) 12%,transparent)}
.bottom-nav button.active svg{transform:scale(1.1)}
.bottom-nav .badge-mini{
  position:absolute;top:4px;right:calc(50% - 20px);
  font-size:9px;font-weight:800;background:var(--danger);color:#fff;
  padding:1px 5px;border-radius:99px;min-width:16px;text-align:center;
  box-shadow:0 2px 8px rgba(0,0,0,.3);
}

/* BUTTONS */
.btn{
  font-family:inherit;font-weight:600;font-size:14px;border:0;cursor:pointer;
  border-radius:12px;padding:11px 18px;
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  transition:all .3s var(--spring);position:relative;overflow:hidden;white-space:nowrap;
  min-height:44px;
}
.btn svg{width:16px;height:16px;flex-shrink:0}
.btn-primary{background:linear-gradient(135deg,var(--primary),var(--primary-2));color:#fff;box-shadow:0 10px 26px -10px var(--primary)}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 14px 32px -10px var(--primary)}
.btn-ghost{background:var(--surface);color:var(--text);border:1px solid var(--border)}
.btn-ghost:hover{background:var(--surface-2);border-color:var(--border-2);transform:translateY(-2px)}
.btn-success{background:linear-gradient(135deg,var(--success),#19c98f);color:#04231a;box-shadow:0 10px 26px -10px var(--success)}
.btn-success:hover{transform:translateY(-2px)}
.btn-danger{background:linear-gradient(135deg,var(--danger),#e0355c);color:#fff;box-shadow:0 10px 26px -10px var(--danger)}
.btn-danger:hover{transform:translateY(-2px)}
.btn-warning{background:linear-gradient(135deg,var(--warning),#ff9f43);color:#3a2200;box-shadow:0 10px 26px -10px var(--warning)}
.btn:active{transform:scale(.96)}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none!important}
.btn.sm{padding:9px 14px;font-size:13px;border-radius:10px;min-height:38px}
.ripple{position:absolute;border-radius:50%;background:rgba(255,255,255,.4);transform:scale(0);animation:rippleAnim .6s ease-out;pointer-events:none}
@keyframes rippleAnim{to{transform:scale(4);opacity:0}}

/* MAIN */
main{
  padding:clamp(16px,3vw,32px) max(clamp(14px,3vw,28px),var(--safe-l)) 60px max(clamp(14px,3vw,28px),var(--safe-r));
  max-width:1440px;margin:0 auto;
}
.view{display:none}
.view.active{display:block;animation:viewIn .5s var(--ease) both}
@keyframes viewIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}

.hero{text-align:center;padding:16px 0 28px}
.hero h1{
  font-size:clamp(24px,6vw,44px);font-weight:800;letter-spacing:-1.2px;line-height:1.15;
  background:linear-gradient(100deg,var(--text) 10%,var(--primary-2) 50%,var(--accent) 90%);
  background-size:200% auto;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  animation:gradShift 6s ease infinite;
}
@keyframes gradShift{0%,100%{background-position:0% center}50%{background-position:100% center}}
.hero p{color:var(--text-dim);margin-top:10px;font-size:clamp(13px,1.6vw,15px);max-width:560px;margin-left:auto;margin-right:auto;padding:0 8px}
.hero-badge{
  display:inline-flex;align-items:center;gap:7px;background:var(--surface);
  border:1px solid var(--border);padding:6px 13px;border-radius:99px;
  font-size:11.5px;font-weight:600;color:var(--text-dim);margin-bottom:14px;
}
.hero-badge .dot{width:6px;height:6px;border-radius:50%;background:var(--success);animation:ping 2s infinite}
@keyframes ping{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--success) 70%,transparent)}70%{box-shadow:0 0 0 9px transparent}100%{box-shadow:0 0 0 0 transparent}}

.section-head{display:flex;align-items:center;gap:10px;margin-bottom:18px;flex-wrap:wrap}
.section-head h2{font-size:clamp(16px,2vw,19px);font-weight:700;letter-spacing:-.4px;display:flex;align-items:center;gap:8px}
.section-head .count-pill{font-size:11px;font-weight:700;padding:3px 10px;border-radius:99px;background:var(--surface-2);color:var(--text-dim);border:1px solid var(--border)}
.section-head .spacer{flex:1;min-width:0}

.search-wrap{position:relative;min-width:160px;flex:1;max-width:100%}
.search-wrap svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--text-faint);pointer-events:none}
.search-input{
  width:100%;font-family:inherit;font-size:16px;font-weight:500;
  padding:11px 14px 11px 38px;border-radius:12px;
  background:var(--surface);border:1px solid var(--border);color:var(--text);outline:none;
  transition:all .3s var(--ease);min-height:44px;
}
.search-input::placeholder{color:var(--text-faint)}
.search-input:focus{border-color:var(--primary);background:var(--surface-2);box-shadow:0 0 0 4px color-mix(in srgb,var(--primary) 15%,transparent)}

/* DECK GRID */
.deck-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px}
.deck-card{
  position:relative;border-radius:var(--r);background:var(--surface);border:1px solid var(--border);
  padding:18px;cursor:pointer;overflow:hidden;
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  transition:transform .45s var(--spring),border-color .35s var(--ease),box-shadow .45s var(--ease);
  animation:cardIn .55s var(--ease) both;animation-delay:calc(var(--i,0) * 50ms);
  display:flex;flex-direction:column;gap:12px;min-height:180px;
}
@keyframes cardIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
.deck-card::before{
  content:'';position:absolute;inset:0;border-radius:var(--r);
  background:radial-gradient(500px circle at var(--mx,50%) var(--my,50%),color-mix(in srgb,var(--c1) 18%,transparent),transparent 45%);
  opacity:0;transition:opacity .4s var(--ease);pointer-events:none;
}
.deck-card:hover::before{opacity:1}
.deck-card:active{transform:scale(.98)}
.deck-accent{position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--c1),var(--c2));opacity:.9}
.deck-top{display:flex;align-items:flex-start;gap:12px}
.deck-icon{
  width:46px;height:46px;border-radius:14px;flex-shrink:0;display:grid;place-items:center;font-size:22px;
  background:linear-gradient(135deg,color-mix(in srgb,var(--c1) 30%,transparent),color-mix(in srgb,var(--c2) 18%,transparent));
  border:1px solid color-mix(in srgb,var(--c1) 35%,transparent);
  transition:transform .5s var(--spring);
}
.deck-card:hover .deck-icon{transform:rotate(-8deg) scale(1.06)}
.deck-title{font-size:15px;font-weight:700;letter-spacing:-.3px;line-height:1.3;word-break:break-word}
.deck-desc{font-size:12.5px;color:var(--text-dim);margin-top:4px;line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.deck-bottom{margin-top:auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.deck-stat{display:flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;color:var(--text-dim)}
.deck-stat svg{width:13px;height:13px;opacity:.7}
.deck-stat .due{color:var(--warning);font-weight:800}
.progress-track{height:6px;border-radius:99px;background:var(--surface-3);overflow:hidden;position:relative}
.progress-fill{
  height:100%;border-radius:99px;background:linear-gradient(90deg,var(--c1),var(--c2));
  transition:width .9s var(--ease);position:relative;box-shadow:0 0 12px -2px var(--c1);
}
.progress-fill::after{
  content:'';position:absolute;inset:0;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.45),transparent);
  transform:translateX(-100%);animation:progShine 2.4s ease-in-out infinite;
}
@keyframes progShine{0%{transform:translateX(-100%)}60%,100%{transform:translateX(200%)}}
.progress-meta{display:flex;justify-content:space-between;font-size:11px;font-weight:600;color:var(--text-faint);margin-top:6px}

.deck-menu{position:absolute;top:10px;right:10px;display:flex;gap:4px;opacity:0;transform:translateY(-6px);transition:all .3s var(--ease)}
.deck-card:hover .deck-menu,.deck-card:focus-within .deck-menu{opacity:1;transform:none}
.mini-btn{
  width:32px;height:32px;border-radius:9px;border:1px solid var(--border);
  background:color-mix(in srgb,var(--bg-2) 88%,transparent);backdrop-filter:blur(10px);
  color:var(--text-dim);cursor:pointer;display:grid;place-items:center;
  transition:all .25s var(--spring);
}
.mini-btn:hover{color:var(--text);background:var(--surface-3);transform:scale(1.1)}
.mini-btn.del:hover{color:var(--danger);border-color:var(--danger)}
.mini-btn svg{width:14px;height:14px}

/* EMPTY */
.empty{
  text-align:center;padding:50px 20px;border-radius:var(--r);
  border:1.5px dashed var(--border-2);background:var(--surface);
}
.empty-emoji{font-size:48px;display:block;margin-bottom:12px;animation:bob 3s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-10px) rotate(4deg)}}
.empty h3{font-size:17px;font-weight:700;margin-bottom:6px}
.empty p{color:var(--text-dim);font-size:13px;margin-bottom:18px}

/* DECK DETAIL */
.detail-head{
  display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  padding:18px;border-radius:var(--r);background:var(--surface);border:1px solid var(--border);
  margin-bottom:18px;position:relative;overflow:hidden;
}
.detail-head::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--c1),var(--c2))}
.detail-head .deck-icon{width:52px;height:52px;font-size:26px}
.detail-info{flex:1;min-width:150px}
.detail-info h2{font-size:clamp(18px,2.4vw,22px);font-weight:800;letter-spacing:-.5px;line-height:1.2;word-break:break-word}
.detail-info p{color:var(--text-dim);font-size:12.5px;margin-top:4px;line-height:1.5}
.detail-actions{display:flex;gap:8px;flex-wrap:wrap}

.action-tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:18px}
.tile{
  padding:16px;border-radius:15px;background:var(--surface);border:1px solid var(--border);
  cursor:pointer;transition:all .35s var(--spring);position:relative;overflow:hidden;
  display:flex;flex-direction:column;gap:6px;
}
.tile:active{transform:scale(.97)}
.tile .ico{font-size:22px}
.tile .t{font-size:14px;font-weight:700;letter-spacing:-.2px}
.tile .d{font-size:11.5px;color:var(--text-dim);line-height:1.4}
.tile .arrow{position:absolute;right:14px;top:50%;transform:translateY(-50%);color:var(--text-faint);transition:all .3s var(--ease)}
.tile:hover .arrow{color:var(--primary);transform:translateY(-50%) translateX(4px)}
.tile.p{background:linear-gradient(135deg,color-mix(in srgb,var(--primary) 12%,var(--surface)),var(--surface))}
.tile.g{background:linear-gradient(135deg,color-mix(in srgb,var(--success) 12%,var(--surface)),var(--surface))}
.tile.w{background:linear-gradient(135deg,color-mix(in srgb,var(--warning) 12%,var(--surface)),var(--surface))}
.tile.a{background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 12%,var(--surface)),var(--surface))}

/* CARD LIST */
.card-list{display:flex;flex-direction:column;gap:10px}
.card-row{
  display:flex;align-items:center;gap:12px;padding:13px 15px;border-radius:14px;
  background:var(--surface);border:1px solid var(--border);transition:all .35s var(--ease);
  animation:cardIn .45s var(--ease) both;animation-delay:calc(var(--i,0) * 30ms);
}
.card-row:hover{border-color:var(--border-2);background:var(--surface-2)}
.card-row .idx{
  width:28px;height:28px;border-radius:8px;flex-shrink:0;display:grid;place-items:center;
  font-size:11px;font-weight:700;background:var(--surface-3);color:var(--text-dim);
}
.card-row .txt{flex:1;min-width:0}
.card-row .front{font-weight:600;font-size:14px;word-break:break-word;white-space:pre-wrap}
.card-row .back{font-size:12.5px;color:var(--text-dim);margin-top:3px;word-break:break-word;white-space:pre-wrap;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.card-row .tools{display:flex;gap:3px;opacity:.4;transition:opacity .3s}
.card-row:hover .tools,.card-row:focus-within .tools{opacity:1}
.level-dots{display:flex;gap:3px;flex-shrink:0}
.level-dots i{width:5px;height:5px;border-radius:50%;background:var(--surface-3);transition:all .3s}
.level-dots i.on{background:var(--success);box-shadow:0 0 6px var(--success)}
.star-btn.on{color:var(--warning)!important;opacity:1!important}

/* STUDY */
.study-wrap{max-width:760px;margin:0 auto}
.study-top{display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.study-top .title{font-weight:700;font-size:14px;letter-spacing:-.3px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.study-top .counter{font-size:13px;color:var(--text-dim);font-weight:700;font-variant-numeric:tabular-nums;flex-shrink:0}
.study-progress{height:8px;border-radius:99px;background:var(--surface-3);overflow:hidden;margin-bottom:22px;position:relative}
.study-progress .fill{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--primary),var(--accent));transition:width .55s var(--ease);box-shadow:0 0 16px -2px var(--primary)}

.flashcard{
  perspective:2000px;width:100%;
  height:clamp(300px,50vh,440px);
  margin-bottom:22px;cursor:pointer;touch-action:manipulation;
}
.flashcard-inner{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .85s var(--ease)}
.flashcard.flipped .flashcard-inner{transform:rotateY(180deg)}
.face{
  position:absolute;inset:0;border-radius:22px;backface-visibility:hidden;-webkit-backface-visibility:hidden;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:clamp(20px,5vw,48px);border:1px solid var(--border-2);box-shadow:var(--shadow);overflow:hidden;
}
.face-front{background:var(--card-front);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);transition:box-shadow .5s var(--ease)}
.face-back{background:var(--card-back);transform:rotateY(180deg);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
.face::after{content:'';position:absolute;inset:0;background:radial-gradient(circle at 50% 0%,rgba(255,255,255,.10),transparent 60%);pointer-events:none}
.face-label{
  position:absolute;top:16px;left:20px;font-size:10px;font-weight:800;
  letter-spacing:2px;text-transform:uppercase;color:var(--text-faint);
}
.face-content{
  font-size:clamp(18px,4vw,28px);font-weight:700;letter-spacing:-.5px;text-align:center;
  line-height:1.4;white-space:pre-wrap;word-break:break-word;max-height:100%;overflow-y:auto;width:100%;
}
.face-back .face-content{font-size:clamp(16px,3.4vw,24px);font-weight:600}
.face-hint{
  position:absolute;bottom:16px;left:0;right:0;text-align:center;
  font-size:10.5px;font-weight:600;color:var(--text-faint);
  display:flex;align-items:center;justify-content:center;gap:6px;flex-wrap:wrap;padding:0 12px;
}
.face-hint kbd{
  font-family:inherit;font-size:10px;font-weight:700;padding:2px 6px;
  border-radius:5px;background:var(--surface-3);border:1px solid var(--border);color:var(--text-dim);
}

.study-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;min-height:52px;align-items:center}
.study-actions .btn{padding:13px 26px;font-size:14.5px;border-radius:14px;flex:1;max-width:240px}
.action-group{display:flex;gap:10px;width:100%;max-width:520px;margin:0 auto;animation:popIn .45s var(--spring) both}
.action-group .btn{flex:1}
@keyframes popIn{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:none}}
.shake{animation:shake .5s var(--ease)}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-10px)}40%{transform:translateX(10px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
.pulse-ok{animation:pulseOk .6s var(--spring)}
@keyframes pulseOk{0%{transform:scale(1)}40%{transform:scale(1.03)}100%{transform:scale(1)}}

.study-foot{margin-top:22px;text-align:center;color:var(--text-faint);font-size:11px;font-weight:500;display:flex;gap:12px;justify-content:center;flex-wrap:wrap;padding:0 8px}
.study-foot span{display:flex;align-items:center;gap:4px}
.study-foot kbd{
  font-family:inherit;background:var(--surface-3);padding:2px 6px;border-radius:5px;
  border:1px solid var(--border);font-size:10.5px;
}

/* QUIZ */
.quiz-wrap{max-width:720px;margin:0 auto}
.quiz-head{display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.quiz-head .title{font-weight:700;font-size:14px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.quiz-head .timer{
  display:flex;align-items:center;gap:5px;padding:6px 11px;border-radius:10px;
  background:var(--surface);border:1px solid var(--border);
  font-size:12.5px;font-weight:700;font-variant-numeric:tabular-nums;flex-shrink:0;
}
.quiz-head .timer.warn{color:var(--danger);border-color:var(--danger);animation:pulseWarn 1s infinite}
@keyframes pulseWarn{0%,100%{background:var(--surface)}50%{background:color-mix(in srgb,var(--danger) 18%,var(--surface))}}
.quiz-head .counter{font-size:13px;color:var(--text-dim);font-weight:700;font-variant-numeric:tabular-nums;flex-shrink:0}

.quiz-question{
  padding:24px 20px;border-radius:20px;
  background:var(--card-front);border:1px solid var(--border-2);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  margin-bottom:18px;min-height:120px;
  display:flex;flex-direction:column;justify-content:center;
  box-shadow:var(--shadow);position:relative;overflow:hidden;
  animation:cardIn .5s var(--ease) both;
}
.quiz-question .q-label{
  position:absolute;top:12px;left:18px;font-size:10px;font-weight:800;
  letter-spacing:2px;color:var(--text-faint);text-transform:uppercase;
}
.quiz-question .q-text{
  font-size:clamp(17px,3.4vw,23px);font-weight:700;letter-spacing:-.4px;
  line-height:1.4;white-space:pre-wrap;word-break:break-word;text-align:center;padding:8px 0;
}
.quiz-question .q-speak{
  position:absolute;bottom:12px;right:14px;
  background:var(--surface-2);border:1px solid var(--border);
  color:var(--text-dim);width:40px;height:40px;border-radius:50%;
  display:grid;place-items:center;cursor:pointer;transition:all .3s var(--spring);
}
.quiz-question .q-speak:hover{color:var(--primary);border-color:var(--primary);transform:scale(1.08)}
.quiz-question .q-speak svg{width:17px;height:17px}

.quiz-options{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.quiz-option{
  padding:14px 16px;border-radius:14px;
  background:var(--surface);border:1.5px solid var(--border);
  cursor:pointer;text-align:left;color:var(--text);
  font-family:inherit;font-size:14px;font-weight:600;line-height:1.4;
  transition:all .25s var(--spring);position:relative;
  display:flex;align-items:center;gap:10px;
  min-height:60px;word-break:break-word;touch-action:manipulation;
}
.quiz-option .key{
  width:26px;height:26px;border-radius:8px;flex-shrink:0;
  display:grid;place-items:center;font-size:11.5px;font-weight:800;
  background:var(--surface-3);color:var(--text-dim);
}
.quiz-option:active:not(.disabled){transform:scale(.97)}
.quiz-option.correct{border-color:var(--success);background:color-mix(in srgb,var(--success) 15%,var(--surface));animation:pulseOk .5s}
.quiz-option.correct .key{background:var(--success);color:#04231a}
.quiz-option.wrong{border-color:var(--danger);background:color-mix(in srgb,var(--danger) 15%,var(--surface));animation:shake .5s}
.quiz-option.wrong .key{background:var(--danger);color:#fff}
.quiz-option.disabled{cursor:not-allowed;opacity:.7}
.quiz-option.dim{opacity:.35}

.type-input{
  width:100%;font-family:inherit;font-size:16px;font-weight:600;
  padding:16px 20px;border-radius:14px;
  background:var(--surface);border:1.5px solid var(--border);color:var(--text);
  outline:none;transition:all .3s var(--ease);text-align:center;min-height:56px;
}
.type-input:focus{border-color:var(--primary);box-shadow:0 0 0 4px color-mix(in srgb,var(--primary) 15%,transparent)}
.type-input.correct{border-color:var(--success);background:color-mix(in srgb,var(--success) 12%,var(--surface))}
.type-input.wrong{border-color:var(--danger);background:color-mix(in srgb,var(--danger) 12%,var(--surface));animation:shake .5s}
.type-answer-box{
  padding:13px 16px;border-radius:12px;margin-top:10px;
  background:color-mix(in srgb,var(--success) 12%,var(--surface));
  border:1px solid var(--success);font-size:13.5px;line-height:1.5;
  animation:popIn .4s var(--spring);word-break:break-word;
}
.type-answer-box .lbl{font-size:10.5px;font-weight:800;color:var(--success);letter-spacing:1.5px;margin-bottom:4px}

/* MATCH GAME */
.match-wrap{max-width:860px;margin:0 auto}
.match-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:18px}
.match-col{display:flex;flex-direction:column;gap:8px}
.match-item{
  padding:13px 14px;border-radius:12px;
  background:var(--surface);border:1.5px solid var(--border);
  cursor:pointer;transition:all .25s var(--spring);
  font-size:13px;font-weight:600;line-height:1.4;
  word-break:break-word;min-height:54px;
  display:flex;align-items:center;touch-action:manipulation;
  animation:cardIn .4s var(--ease) both;animation-delay:calc(var(--i,0)*30ms);
}
.match-item:active:not(.matched){transform:scale(.97)}
.match-item.selected{border-color:var(--primary);background:color-mix(in srgb,var(--primary) 15%,var(--surface));box-shadow:0 0 0 4px color-mix(in srgb,var(--primary) 15%,transparent)}
.match-item.matched{opacity:.35;pointer-events:none;border-color:var(--success);background:color-mix(in srgb,var(--success) 15%,var(--surface));animation:pulseOk .6s}
.match-item.wrong{animation:shake .5s;border-color:var(--danger)}

/* TODAY */
.today-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px;margin-bottom:18px}
.today-card{
  padding:18px;border-radius:var(--r);background:var(--surface);border:1px solid var(--border);
  position:relative;overflow:hidden;transition:all .35s var(--spring);
  animation:cardIn .5s var(--ease) both;animation-delay:calc(var(--i,0)*50ms);
}
.today-card:active{transform:scale(.98)}
.today-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--c1),var(--c2))}
.today-card .row{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.today-card .due-count{font-size:30px;font-weight:800;letter-spacing:-1.4px;color:var(--warning);line-height:1}
.today-card .due-lbl{font-size:11.5px;color:var(--text-dim);font-weight:600}
.today-card .title{font-size:14.5px;font-weight:700;flex:1;min-width:0;letter-spacing:-.2px;word-break:break-word}

/* STATS */
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:22px}
.stat-box{
  padding:18px;border-radius:var(--r);background:var(--surface);border:1px solid var(--border);
  position:relative;overflow:hidden;animation:cardIn .5s var(--ease) both;
  animation-delay:calc(var(--i,0)*40ms);transition:transform .4s var(--spring),border-color .3s;
}
.stat-box:active{transform:scale(.98)}
.stat-box .glow{position:absolute;top:-40px;right:-40px;width:110px;height:110px;border-radius:50%;filter:blur(40px);opacity:.5}
.stat-box .ico{font-size:19px;margin-bottom:9px;display:block}
.stat-box .v{font-size:26px;font-weight:800;letter-spacing:-1.2px;line-height:1;font-variant-numeric:tabular-nums}
.stat-box .l{font-size:11px;font-weight:600;color:var(--text-dim);margin-top:6px;letter-spacing:.3px}

.heatmap{
  padding:16px;border-radius:var(--r);background:var(--surface);border:1px solid var(--border);
  margin-bottom:18px;overflow-x:auto;-webkit-overflow-scrolling:touch;
}
.heatmap-grid{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,11px);gap:3px;min-width:max-content}
.heat-cell{
  width:11px;height:11px;border-radius:2.5px;background:var(--surface-3);
  transition:transform .2s;
}
.heat-cell.l1{background:color-mix(in srgb,var(--success) 25%,var(--surface-3))}
.heat-cell.l2{background:color-mix(in srgb,var(--success) 50%,var(--surface-3))}
.heat-cell.l3{background:color-mix(in srgb,var(--success) 75%,var(--surface-3))}
.heat-cell.l4{background:var(--success);box-shadow:0 0 6px -1px var(--success)}
.heat-legend{display:flex;align-items:center;gap:7px;font-size:11px;color:var(--text-dim);margin-top:10px;flex-wrap:wrap}
.heat-legend .swatch{width:11px;height:11px;border-radius:2.5px}

.bar-list{display:flex;flex-direction:column;gap:12px}
.bar-item{
  padding:14px 16px;border-radius:14px;background:var(--surface);border:1px solid var(--border);
  animation:cardIn .5s var(--ease) both;animation-delay:calc(var(--i,0)*40ms);
}
.bar-item .top{display:flex;align-items:center;gap:10px;margin-bottom:9px}
.bar-item .name{font-weight:700;font-size:13px;flex:1;letter-spacing:-.2px;word-break:break-word}
.bar-item .pct{font-size:12px;font-weight:700;color:var(--text-dim);font-variant-numeric:tabular-nums;flex-shrink:0}
.bar-item .emoji{font-size:17px;flex-shrink:0}

/* TRASH */
.trash-list{display:flex;flex-direction:column;gap:10px}
.trash-item{
  display:flex;align-items:center;gap:12px;padding:14px;border-radius:14px;
  background:var(--surface);border:1px solid var(--border);
  opacity:.85;transition:all .3s var(--ease);flex-wrap:wrap;
}
.trash-item .ico{font-size:20px;width:40px;height:40px;border-radius:11px;background:var(--surface-3);display:grid;place-items:center;flex-shrink:0}
.trash-item .info{flex:1;min-width:140px}
.trash-item .name{font-weight:700;font-size:13.5px;word-break:break-word}
.trash-item .meta{font-size:11.5px;color:var(--text-dim);margin-top:2px}
.trash-item .actions{display:flex;gap:6px;flex-shrink:0}

/* RESULT */
.result{text-align:center;max-width:520px;margin:20px auto;padding:0 8px}
.result-ring{width:150px;height:150px;margin:0 auto 22px;position:relative}
.result-ring svg{transform:rotate(-90deg);width:100%;height:100%}
.result-ring .track{fill:none;stroke:var(--surface-3);stroke-width:11}
.result-ring .bar{
  fill:none;stroke:url(#ringGrad);stroke-width:11;stroke-linecap:round;
  stroke-dasharray:440;stroke-dashoffset:440;transition:stroke-dashoffset 1.4s var(--ease) .2s;
}
.result-ring .pct{
  position:absolute;inset:0;display:grid;place-items:center;
  font-size:36px;font-weight:800;letter-spacing:-2px;
  background:linear-gradient(135deg,var(--primary),var(--accent));
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
}
.result h2{font-size:clamp(20px,4vw,25px);font-weight:800;letter-spacing:-.7px;margin-bottom:8px}
.result p{color:var(--text-dim);font-size:13.5px;margin-bottom:20px}
.result-stats{display:flex;gap:10px;justify-content:center;margin-bottom:22px;flex-wrap:wrap}
.rs{flex:1;min-width:100px;padding:14px 10px;border-radius:14px;background:var(--surface);border:1px solid var(--border)}
.rs .v{font-size:22px;font-weight:800;letter-spacing:-1px}
.rs .l{font-size:10.5px;font-weight:600;color:var(--text-dim);margin-top:3px;letter-spacing:.3px}
.rs.good .v{color:var(--success)}
.rs.bad .v{color:var(--danger)}
.result-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}

/* MODAL — bottom sheet on mobile */
.overlay{
  position:fixed;inset:0;z-index:500;background:rgba(3,3,12,.72);
  backdrop-filter:blur(9px);-webkit-backdrop-filter:blur(9px);
  display:flex;align-items:center;justify-content:center;padding:20px;
  animation:fadeIn .3s var(--ease) both;
}
:root[data-theme="light"] .overlay{background:rgba(40,30,90,.42)}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.overlay.closing{animation:fadeOut .25s var(--ease) both}
@keyframes fadeOut{to{opacity:0}}
.modal{
  width:100%;max-width:520px;max-height:88vh;overflow-y:auto;
  background:var(--bg-2);border:1px solid var(--border-2);border-radius:22px;padding:24px;
  box-shadow:0 40px 100px -20px rgba(0,0,0,.9);animation:modalIn .45s var(--spring) both;
  -webkit-overflow-scrolling:touch;
}
.overlay.closing .modal{animation:modalOut .25s var(--ease) both}
@keyframes modalIn{from{opacity:0;transform:scale(.9) translateY(30px)}to{opacity:1;transform:none}}
@keyframes modalOut{to{opacity:0;transform:scale(.94) translateY(16px)}}
.modal h3{font-size:18px;font-weight:800;letter-spacing:-.4px;margin-bottom:18px;display:flex;align-items:center;gap:8px}
.modal .desc{color:var(--text-dim);font-size:13.5px;line-height:1.6;margin-bottom:16px}
.field{margin-bottom:14px}
.field label{display:block;font-size:12px;font-weight:700;color:var(--text-dim);margin-bottom:7px;letter-spacing:.2px}
.input,.textarea,select.input{
  width:100%;font-family:inherit;font-size:16px;font-weight:500;
  padding:12px 14px;border-radius:12px;background:var(--surface);border:1px solid var(--border);
  color:var(--text);outline:none;transition:all .3s var(--ease);resize:vertical;min-height:46px;
}
.input:focus,.textarea:focus,select.input:focus{border-color:var(--primary);box-shadow:0 0 0 4px color-mix(in srgb,var(--primary) 15%,transparent)}
.textarea{min-height:100px;line-height:1.55;font-family:inherit}
.emoji-picker{display:flex;gap:6px;flex-wrap:wrap}
.emoji-opt{
  width:42px;height:42px;border-radius:11px;font-size:19px;
  background:var(--surface);border:1.5px solid var(--border);cursor:pointer;
  display:grid;place-items:center;transition:all .28s var(--spring);
}
.emoji-opt:active{transform:scale(.92)}
.emoji-opt.sel{border-color:var(--primary);background:color-mix(in srgb,var(--primary) 18%,transparent);box-shadow:0 0 0 4px color-mix(in srgb,var(--primary) 12%,transparent)}
.color-picker{display:flex;gap:8px;flex-wrap:wrap}
.color-opt{width:36px;height:36px;border-radius:10px;cursor:pointer;border:2.5px solid transparent;transition:all .28s var(--spring)}
.color-opt:active{transform:scale(.92)}
.color-opt.sel{border-color:var(--text);transform:scale(1.08)}
.modal-actions{display:flex;gap:10px;margin-top:20px}
.modal-actions .btn{flex:1}
.tabs{display:flex;gap:4px;background:var(--surface);border:1px solid var(--border);padding:4px;border-radius:11px;margin-bottom:16px}
.tabs button{
  flex:1;border:0;background:transparent;color:var(--text-dim);
  font-family:inherit;font-size:12.5px;font-weight:600;padding:9px 8px;border-radius:8px;cursor:pointer;
  transition:all .3s var(--ease);min-height:40px;
}
.tabs button.active{color:#fff;background:linear-gradient(135deg,var(--primary),var(--primary-2))}

/* TOAST */
#toast-root{
  position:fixed;bottom:calc(20px + var(--bottomnav-h) + var(--safe-b));left:50%;transform:translateX(-50%);z-index:9000;
  display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;
  width:max-content;max-width:calc(92vw - var(--safe-l) - var(--safe-r));
}
.toast{
  padding:12px 18px;border-radius:13px;background:var(--bg-2);border:1px solid var(--border-2);
  box-shadow:0 18px 50px -12px rgba(0,0,0,.7);
  font-size:13px;font-weight:600;display:flex;align-items:center;gap:9px;
  animation:toastIn .45s var(--spring) both;max-width:100%;
}
.toast.out{animation:toastOut .3s var(--ease) both}
@keyframes toastIn{from{opacity:0;transform:translateY(24px) scale(.9)}to{opacity:1;transform:none}}
@keyframes toastOut{to{opacity:0;transform:translateY(-14px) scale(.95)}}
.toast .dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}

/* ============ RESPONSIVE ============ */

/* TABLET */
@media (max-width: 1024px) {
  .nav button .nav-label{display:none}

}

/* SMALL TABLET / LARGE PHONE — switch to bottom nav */
@media (max-width: 820px) {

/* MOBILE */
@media (max-width: 640px) {

  .study-actions .btn{padding:13px 18px;font-size:14px;flex:1;max-width:none}
  .study-foot{margin-top:16px;gap:10px}

  .quiz-options{grid-template-columns:1fr;gap:8px}
  .quiz-option{padding:13px 14px;font-size:13.5px;min-height:56px}

  .match-grid{grid-template-columns:1fr;gap:14px}
  .match-col{gap:6px}
  .match-item{padding:12px;font-size:12.5px;min-height:50px}

  .stat-grid{grid-template-columns:1fr 1fr;gap:10px}
  .stat-box{padding:15px}
  .stat-box .v{font-size:22px}
  .stat-box .ico{font-size:17px}

  .today-grid{grid-template-columns:1fr;gap:12px}

  .section-head .search-wrap{order:3;flex-basis:100%;max-width:100%;margin-top:4px}
  .section-head .spacer{display:none}

  /* MODAL — BOTTOM SHEET */
  .overlay{
    align-items:flex-end;padding:0;
  }
  .modal{
    max-width:100%;max-height:92vh;border-radius:22px 22px 0 0;
    padding:20px 18px calc(20px + var(--safe-b));

  @keyframes sheetIn{from{opacity:0;transform:translateY(100%)}to{opacity:1;transform:none}}
  @keyframes sheetOut{to{opacity:0;transform:translateY(100%)}}
  .modal::before{
    content:'';position:absolute;top:8px;left:50%;transform:translateX(-50%);

  /* Bottom nav bigger tap */
  .bottom-nav button{min-height:56px;font-size:10.5px}
  .bottom-nav button svg{width:22px;height:22px}
}

/* TINY */
@media (max-width: 380px) {

/* Prevent zoom on input focus on iOS */

<script>
/* ============ CONSTANTS ============ */
const STORAGE_KEY = 'qusin-flashcard-v1';
const COLORS = [
  ['#7c5cff','#b06cff'], ['#ff5c9d','#ff8f6b'], ['#2ee6a8','#22b8ff'],
  ['#ffc542','#ff7a45'], ['#22b8ff','#7c5cff'], ['#ff6b6b','#ff5c9d'],
  ['#00d4a0','#2ee6a8'], ['#a855f7','#ec4899']
];
const EMOJIS = ['📘','🧠','🌍','🔬','💡','🎯','📝','🗣️','🧮','🎨','⚗️','🏛️','💻','🎵','🚀','🌟','📖','🔤'];
const INTERVALS = [0, 1, 3, 7, 14, 30];

/* ============ STATE ============ */
let state = {
  decks: [],
  trash: [],
  streak: { current: 0, best: 0, dates: [] },
  settings: { theme: 'dark', sound: true }
};
let currentDeckId = null;
let searchQuery = '';
let session = null;

const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const dayKey = (t = Date.now()) => new Date(t).toISOString().slice(0, 10);

function save() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch(e) { console.warn(e); }
}
function load() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const p = JSON.parse(raw);
      if (p && Array.isArray(p.decks)) {
        state = {
          decks: p.decks,
          trash: p.trash || [],
          streak: p.streak || { current: 0, best: 0, dates: [] },
          settings: Object.assign({ theme: 'dark', sound: true }, p.settings || {})
        };
        return;
      }
    }
  } catch(e) { console.warn(e); }
  seed();
}
function seed() {
  state.decks = [
    { id: uid(), name: 'Từ vựng tiếng Anh', desc: 'Những từ vựng thông dụng cho người mới bắt đầu.',
      icon: '📘', color: 0, created: Date.now(),
      cards: [
        { id: uid(), front: 'Abundant', back: 'Phong phú, dồi dào, nhiều', starred: false, level: 0, correct: 0, wrong: 0, reviewed: 0, lastReviewed: 0 },
        { id: uid(), front: 'Benevolent', back: 'Nhân từ, tốt bụng, rộng lượng', starred: false, level: 0, correct: 0, wrong: 0, reviewed: 0, lastReviewed: 0 },
        { id: uid(), front: 'Candid', back: 'Thẳng thắn, chân thật, bộc trực', starred: false, level: 0, correct: 0, wrong: 0, reviewed: 0, lastReviewed: 0 },
        { id: uid(), front: 'Diligent', back: 'Siêng năng, cần cù, chăm chỉ', starred: false, level: 0, correct: 0, wrong: 0, reviewed: 0, lastReviewed: 0 },
        { id: uid(), front: 'Eloquent', back: 'Hùng hồn, có tài hùng biện', starred: false, level: 0, correct: 0, wrong: 0, reviewed: 0, lastReviewed: 0 },
        { id: uid(), front: 'Frugal', back: 'Tiết kiệm, thanh đạm', starred: false, level: 0, correct: 0, wrong: 0, reviewed: 0, lastReviewed: 0 }
      ]
    },
    { id: uid(), name: 'Kiến thức lập trình', desc: 'Khái niệm nền tảng trong lập trình.',
      icon: '💻', color: 2, created: Date.now(),
      cards: [
        { id: uid(), front: 'Big O Notation là gì?', back: 'Ký hiệu mô tả độ phức tạp thuật toán khi đầu vào tăng.', starred: true, level: 0, correct: 0, wrong: 0, reviewed: 0, lastReviewed: 0 },
        { id: uid(), front: 'Stack khác Queue thế nào?', back: 'Stack: LIFO — vào sau ra trước.\nQueue: FIFO — vào trước ra trước.', starred: false, level: 0, correct: 0, wrong: 0, reviewed: 0, lastReviewed: 0 },
        { id: uid(), front: 'Đệ quy là gì?', back: 'Hàm tự gọi chính nó, cần base case và recursive step.', starred: false, level: 0, correct: 0, wrong: 0, reviewed: 0, lastReviewed: 0 },
        { id: uid(), front: 'HTTP status 404 nghĩa là gì?', back: 'Not Found — Không tìm thấy tài nguyên.', starred: false, level: 0, correct: 0, wrong: 0, reviewed: 0, lastReviewed: 0 }
      ]
    }
  ];
  save();
}

/* ============ HELPERS ============ */
const getDeck = id => state.decks.find(d => d.id === id);
const deckColor = d => COLORS[(d.color || 0) % COLORS.length];
function mastery(deck) {
  if (!deck.cards.length) return 0;
  const sum = deck.cards.reduce((a, c) => a + Math.min(c.level || 0, 5), 0);
  return Math.round(sum / (deck.cards.length * 5) * 100);
}
function isDue(card) {
  if (!card.lastReviewed) return true;
  const days = INTERVALS[Math.min(card.level || 0, 5)] || 0;
  return (card.lastReviewed + days * 86400000) <= Date.now();
}
function dueCards(deck) { return deck.cards.filter(isDue); }
function totalDue() { return state.decks.reduce((a, d) => a + dueCards(d).length, 0); }
function totalStats() {
  const decks = state.decks;
  const cards = decks.reduce((a, d) => a + d.cards.length, 0);
  const mastered = decks.reduce((a, d) => a + d.cards.filter(c => (c.level || 0) >= 4).length, 0);
  const correct = decks.reduce((a, d) => a + d.cards.reduce((s, c) => s + (c.correct || 0), 0), 0);
  const wrong = decks.reduce((a, d) => a + d.cards.reduce((s, c) => s + (c.wrong || 0), 0), 0);
  const t = correct + wrong;
  return { deckCount: decks.length, cards, mastered, correct, wrong, total: t, accuracy: t ? Math.round(correct / t * 100) : 0 };
}

/* ============ SOUND ============ */
let audioCtx = null;
function beep(freq = 660, dur = 0.09, type = 'sine', vol = 0.045) {
  if (!state.settings.sound) return;
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, audioCtx.currentTime);
    g.gain.setValueAtTime(vol, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + dur);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(); o.stop(audioCtx.currentTime + dur);
  } catch(e) {}
}
function chord(freqs, dur = 0.14, gap = 0.07) {
  freqs.forEach((f, i) => setTimeout(() => beep(f, dur, 'triangle', .05), i * gap * 1000));
}
function speak(text, lang = 'en-US') {
  if (!state.settings.sound || !window.speechSynthesis) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = lang; u.rate = 0.9;
  speechSynthesis.speak(u);
}

/* ============ CONFETTI ============ */
const cc = document.getElementById('confetti');
const cx = cc.getContext('2d');
let particles = [], cRAF = null;
function resizeCC() {
  cc.width = innerWidth * devicePixelRatio;
  cc.height = innerHeight * devicePixelRatio;
  cc.style.width = innerWidth + 'px'; cc.style.height = innerHeight + 'px';
  cx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
}
resizeCC();
addEventListener('resize', resizeCC);
function burstConfetti(n = 130) {
  const w = innerWidth;
  const colors = ['#7c5cff','#b06cff','#ff5c9d','#2ee6a8','#ffc542','#22b8ff','#ff8f6b'];
  for (let i = 0; i < n; i++) {
    particles.push({
      x: w/2 + (Math.random()-.5)*w*.5, y: innerHeight*.42 + (Math.random()-.5)*60,
      vx: (Math.random()-.5)*16, vy: -Math.random()*17 - 5,
      size: Math.random()*9 + 4, color: colors[(Math.random()*colors.length)|0],
      rot: Math.random()*Math.PI*2, vr: (Math.random()-.5)*.35, life: 1,
      shape: Math.random() > .5 ? 'rect' : 'circle'
    });
  }
  if (!cRAF) cRAF = requestAnimationFrame(animCC);
}
function animCC() {
  cx.clearRect(0, 0, innerWidth, innerHeight);
  particles.forEach(p => { p.vy += .42; p.vx *= .992; p.x += p.vx; p.y += p.vy; p.rot += p.vr; p.life -= .006; });
  particles = particles.filter(p => p.life > 0 && p.y < innerHeight + 60);
  particles.forEach(p => {
    cx.save();
    cx.globalAlpha = Math.max(0, Math.min(1, p.life));
    cx.translate(p.x, p.y); cx.rotate(p.rot); cx.fillStyle = p.color;
    if (p.shape === 'rect') cx.fillRect(-p.size/2, -p.size/4, p.size, p.size/2);
    else { cx.beginPath(); cx.arc(0, 0, p.size/2.4, 0, Math.PI*2); cx.fill(); }
    cx.restore();
  });
  if (particles.length) cRAF = requestAnimationFrame(animCC);
  else { cx.clearRect(0, 0, innerWidth, innerHeight); cRAF = null; }
}

/* ============ TOAST ============ */
function toast(msg, type = 'info') {
  const colors = { info: 'var(--primary)', success: 'var(--success)', error: 'var(--danger)', warn: 'var(--warning)' };
  const el = document.createElement('div');
  el.className = 'toast';
  el.innerHTML = `<span class="dot" style="background:${colors[type]};box-shadow:0 0 10px ${colors[type]}"></span><span>${esc(msg)}</span>`;
  $('#toast-root').appendChild(el);
  setTimeout(() => { el.classList.add('out'); setTimeout(() => el.remove(), 320); }, 2400);
}

/* ============ MODAL ============ */
function openModal(html, onMount) {
  const ov = document.createElement('div');
  ov.className = 'overlay';
  ov.innerHTML = `<div class="modal">${html}</div>`;
  ov.addEventListener('mousedown', e => { if (e.target === ov) closeModal(ov); });
  $('#modalRoot').appendChild(ov);
  document.body.style.overflow = 'hidden';
  if (onMount) onMount(ov);
  return ov;
}
function closeModal(ov) {
  const el = ov || document.querySelector('.overlay');
  if (!el) return;
  el.classList.add('closing');
  document.body.style.overflow = '';
  setTimeout(() => el.remove(), 260);
}
addEventListener('keydown', e => { if (e.key === 'Escape' && document.querySelector('.overlay')) closeModal(); });

/* ============ RIPPLE ============ */
document.addEventListener('click', e => {
  const btn = e.target.closest('.btn');
  if (!btn) return;
  const r = btn.getBoundingClientRect();
  const s = Math.max(r.width, r.height);
  const sp = document.createElement('span');
  sp.className = 'ripple';
  sp.style.width = sp.style.height = s + 'px';
  sp.style.left = (e.clientX - r.left - s/2) + 'px';
  sp.style.top = (e.clientY - r.top - s/2) + 'px';
  btn.appendChild(sp);
  setTimeout(() => sp.remove(), 620);
});

/* ============ STREAK ============ */
function recordStudy() {
  const today = dayKey();
  const dates = state.streak.dates || [];
  if (!dates.includes(today)) {
    dates.push(today);
    const y = dayKey(Date.now() - 86400000);
    state.streak.current = dates.includes(y) ? (state.streak.current || 0) + 1 : 1;
    if (state.streak.current > (state.streak.best || 0)) state.streak.best = state.streak.current;
    state.streak.dates = dates.slice(-400);
    save();
  }
  renderStreak();
}
function renderStreak() {
  const el = $('#streakNum');
  if (el) el.textContent = state.streak.current || 0;
  const today = dayKey();
  const studied = (state.streak.dates || []).includes(today);
  const badge = document.querySelector('.streak-badge');
  if (badge) badge.style.opacity = studied ? '1' : '.65';
}

/* ============ ROUTER ============ */
function go(view) {
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  const el = document.getElementById('view-' + view);
  if (el) { el.classList.remove('active'); void el.offsetWidth; el.classList.add('active'); }
  document.querySelectorAll('[data-nav]').forEach(b => b.classList.toggle('active', b.dataset.nav === view));
  if (view === 'decks') renderDecks();
  if (view === 'today') renderToday();
  if (view === 'stats') renderStats();
  if (view === 'trash') renderTrash();
  if (view !== 'study' && view !== 'quiz' && view !== 'match') session = null;
  updateBadges();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
document.querySelectorAll('[data-nav]').forEach(b => b.addEventListener('click', () => go(b.dataset.nav)));

function updateBadges() {
  const due = totalDue();
  ['todayBadge', 'todayBadgeDesktop'].forEach(id => {
    const el = document.getElementById(id);
    if (el) { el.textContent = due; el.style.display = due > 0 ? 'inline-block' : 'none'; }

    const el = document.getElementById(id);
    if (el) { el.textContent = state.trash.length; el.style.display = state.trash.length > 0 ? 'inline-block' : 'none'; }
  });
}

  const info = document.querySelector('.detail-info p');
  if (info) info.innerHTML = `${esc(deck.desc || 'Không có mô tả')} · ${deck.cards.length} thẻ · ${m}% thành thạo${due ? ` · <span style="color:var(--warning);font-weight:700">${due} cần ôn</span>` : ''}`;
  const pill = document.querySelector('#view-deck .count-pill');
  if (pill) pill.textContent = deck.cards.length;
  const sb = $('#studyBtn');
  if (sb) sb.disabled = !deck.cards.length;
}

/* ============ CARD MODAL ============ */
function openCardModal(card) {
  const deck = getDeck(currentDeckId);
  if (!deck) return;
  const editing = !!card;
  const c = card || { front: '', back: '' };
  openModal(`
    <h3>${editing ? '✏️ Sửa thẻ' : '➕ Thêm thẻ'}</h3>
    <div class="field"><label>Mặt trước (câu hỏi)</label><textarea class="textarea" id="cFront" placeholder="Nhập câu hỏi...">${esc(c.front)}</textarea></div>
    <div class="field"><label>Mặt sau (đáp án)</label><textarea class="textarea" id="cBack" placeholder="Nhập câu trả lời...">${esc(c.back)}</textarea></div>

/* ============ STUDY (FLASHCARD) ============ */
function startStudy(deckId, cardIds) {
  const deck = getDeck(deckId);
  if (!deck || !cardIds.length) { toast('Bộ thẻ trống!', 'warn'); return; }
  const queue = cardIds.slice().sort((a, b) => {
    const ca = deck.cards.find(c => c.id === a), cb = deck.cards.find(c => c.id === b);
    if (!ca || !cb) return 0;
    return (ca.level || 0) - (cb.level || 0);
  });
  session = { mode: 'study', deckId, queue, index: 0, flipped: false, results: { good: 0, bad: 0 }, startTime: Date.now(), total: queue.length, answered: false };
  go('study');
  renderStudy();
}

function renderStudy() {
  if (!session || session.mode !== 'study') return;
  const deck = getDeck(session.deckId);
  if (!deck) return;
  if (session.index >= session.queue.length) { renderResult(); return; }
  const cardId = session.queue[session.index];
  const card = deck.cards.find(c => c.id === cardId);
  if (!card) { session.index++; renderStudy(); return; }
  const pct = Math.round(session.index / session.total * 100);
  const wrap = $('#studyWrap');
  wrap.innerHTML = `
    <div class="study-top">
      <button class="icon-btn" onclick="exitStudy()" title="Thoát" aria-label="Thoát">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button>
      <span class="title">${esc(deck.icon)} ${esc(deck.name)}</span>
      <button class="mini-btn ${card.starred ? 'star-btn on' : ''}" id="studyStar" title="Đánh dấu" style="width:36px;height:36px;opacity:1">
        <svg viewBox="0 0 24 24" fill="${card.starred ? 'currentColor' : 'none'}" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
      </button>
      <span class="counter">${session.index + 1} / ${session.total}</span>
    </div>
    <div class="study-progress"><div class="fill" style="width:${pct}%"></div></div>
    <div class="flashcard" id="flashcard">
      <div class="flashcard-inner">
        <div class="face face-front">
          <span class="face-label">Câu hỏi</span>
          <div class="face-content">${esc(card.front)}</div>
          <div class="face-hint">Nhấn để lật · <kbd>Space</kbd></div>
        </div>
        <div class="face face-back">
          <span class="face-label">Đáp án</span>
          <div class="face-content">${esc(card.back)}</div>
          <div class="face-hint">Bạn đã nhớ chưa?</div>
        </div>
      </div>
    </div>
    <div class="study-actions" id="studyActions"></div>
    <div class="study-foot">
      <span><kbd>Space</kbd> lật thẻ</span>
      <span><kbd>1</kbd> đã nhớ</span>
      <span><kbd>2</kbd> chưa nhớ</span>
      <span><kbd>Esc</kbd> thoát</span>
    </div>
  `;
  $('#flashcard').addEventListener('click', flipCard);
  $('#studyStar').addEventListener('click', e => {
    e.stopPropagation();
    card.starred = !card.starred; save();
    const btn = e.currentTarget;
    btn.classList.toggle('star-btn on', card.starred);
    btn.querySelector('svg').setAttribute('fill', card.starred ? 'currentColor' : 'none');
    beep(card.starred ? 900 : 480, .08, 'triangle', .04);
  });
  renderStudyActions();
}

function renderStudyActions() {
  const box = $('#studyActions');
  if (!box) return;
  if (!session.flipped) {
    box.innerHTML = `<button class="btn btn-primary" id="flipBtn" style="max-width:280px">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 1l4 4-4 4"/><path d="M3 11V9a4 4 0 014-4h14"/><path d="M7 23l-4-4 4-4"/><path d="M21 13v2a4 4 0 01-4 4H3"/></svg>
      Lật thẻ</button>`;
    $('#flipBtn').addEventListener('click', e => { e.stopPropagation(); flipCard(); });
  } else {
    box.innerHTML = `<div class="action-group">
      <button class="btn btn-danger" id="badBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6L6 18M6 6l12 12"/></svg>Chưa nhớ</button>
      <button class="btn btn-success" id="goodBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>Đã nhớ</button>
    </div>`;
    $('#badBtn').addEventListener('click', () => rateStudy(false));
    $('#goodBtn').addEventListener('click', () => rateStudy(true));
  }
}

function flipCard() {
  if (!session || session.mode !== 'study') return;
  const fc = $('#flashcard');
  if (!fc) return;
  session.flipped = !session.flipped;
  fc.classList.toggle('flipped', session.flipped);
  beep(session.flipped ? 620 : 480, .07);
  renderStudyActions();
}

function rateStudy(good) {
  if (!session || !session.flipped) return;
  const deck = getDeck(session.deckId);
  const card = deck.cards.find(c => c.id === session.queue[session.index]);
  if (card) {
    card.reviewed = (card.reviewed || 0) + 1;
    card.lastReviewed = Date.now();
    if (good) {
      card.level = Math.min(5, (card.level || 0) + 1);
      card.correct = (card.correct || 0) + 1;
      session.results.good++;
      beep(880, .09, 'triangle', .05);
      setTimeout(() => beep(1180, .11, 'triangle', .045), 80);
    } else {
      card.level = Math.max(0, (card.level || 0) - 1);
      card.wrong = (card.wrong || 0) + 1;
      session.results.bad++;
      beep(220, .16, 'sawtooth', .04);
      const fc = $('#flashcard');
      if (fc) { fc.classList.add('shake'); setTimeout(() => fc.classList.remove('shake'), 520); }
    }
  }
  save();
  session.flipped = false;
  session.index++;
  setTimeout(() => renderStudy(), good ? 300 : 450);
}

function exitStudy() {
  const sid = session?.deckId;
  session = null;
  if (sid && getDeck(sid)) { currentDeckId = sid; renderDeckDetail(); go('deck'); }
  else go('decks');
}

function renderResult() {
  const wrap = $('#studyWrap');
  const total = session.results.good + session.results.bad;
  const pct = total ? Math.round(session.results.good / total * 100) : 0;

  else if (pct >= 70) { emoji = '🎉'; title = 'Làm tốt!'; sub = 'Tiến bộ rõ rệt!'; }
  else if (pct >= 50) { emoji = '👍'; title = 'Khá ổn!'; sub = 'Ôn thêm một lượt nữa nhé.'; }
  const circ = 440, off = circ - (pct / 100) * circ;
  wrap.innerHTML = `
    <div class="result">
      <div class="result-ring">
        <svg viewBox="0 0 160 160">
          <defs><linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#7c5cff"/><stop offset="100%" stop-color="#ff5c9d"/></linearGradient></defs>
          <circle class="track" cx="80" cy="80" r="70"/>
          <circle class="bar" cx="80" cy="80" r="70" stroke-dashoffset="${circ}"/>
        </svg>
        <div class="pct">${pct}%</div>
      </div>
      <h2>${emoji} ${title}</h2>
      <p>${sub}</p>
      <div class="result-stats">
        <div class="rs good"><div class="v">${session.results.good}</div><div class="l">ĐÃ NHỚ</div></div>
        <div class="rs bad"><div class="v">${session.results.bad}</div><div class="l">CHƯA NHỚ</div></div>
        <div class="rs"><div class="v">${mins}′${String(secs).padStart(2, '0')}″</div><div class="l">THỜI GIAN</div></div>
      </div>
      <div class="result-actions">
        <button class="btn btn-ghost" onclick="exitStudy()">Về bộ thẻ</button>
        <button class="btn btn-primary" id="againBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M23 4v6h-6"/><path d="M1 20v-6h6"/><path d="M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15"/></svg>
          Học lại
        </button>
      </div>
    </div>`;
  requestAnimationFrame(() => { const b = wrap.querySelector('.bar'); if (b) b.style.strokeDashoffset = off; });
  recordStudy();
  if (pct >= 50) { setTimeout(() => burstConfetti(pct >= 90 ? 200 : 120), 380); chord([660, 880, 1100], .16, .09); }
  else beep(440, .2);
  $('#againBtn').addEventListener('click', () => startStudy(session.deckId, session.queue));
}

/* ============ QUIZ ============ */
function startQuiz(deckId, mode) {
  const deck = getDeck(deckId);
  if (!deck || deck.cards.length < 2) { toast('Cần ít nhất 2 thẻ!', 'warn'); return; }
  const queue = deck.cards.map(c => c.id).sort(() => Math.random() - .5).slice(0, Math.min(deck.cards.length, 20));
  session = {
    mode: 'quiz', variant: mode, deckId, queue, index: 0,
    results: { good: 0, bad: 0 }, startTime: Date.now(), total: queue.length,
    answered: false, currentOptions: null, timer: null, timeLimit: 0
  };
  session.timeLimit = mode === 'type' ? 45 : 30;
  go('quiz');
  renderQuiz();
}

function renderQuiz() {
  if (!session || session.mode !== 'quiz') return;
  const deck = getDeck(session.deckId);
  if (!deck) return;
  if (session.index >= session.queue.length) { renderQuizResult(); return; }
  if (session.timer) clearInterval(session.timer);

  const cardId = session.queue[session.index];
  const card = deck.cards.find(c => c.id === cardId);
  if (!card) { session.index++; renderQuiz(); return; }
  const pct = Math.round(session.index / session.total * 100);
  const wrap = $('#quizWrap');
  const modeLabel = { mcq: '🎯 Trắc nghiệm', type: '⌨️ Gõ đáp án', listen: '🔊 Nghe & viết' }[session.variant];

  wrap.innerHTML = `
    <div class="quiz-head">
      <button class="icon-btn" onclick="exitQuiz()" title="Thoát" aria-label="Thoát">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button>
      <span class="title">${esc(deck.icon)} ${esc(deck.name)}</span>
      <span class="timer" id="quizTimer">⏱ <span id="timerNum">${session.timeLimit}</span>s</span>
      <span class="counter">${session.index + 1} / ${session.total}</span>
    </div>
    <div class="study-progress"><div class="fill" style="width:${pct}%"></div></div>
    <div class="quiz-question">
      <span class="q-label">${session.variant === 'listen' ? 'Nghe và trả lời' : modeLabel}</span>
      <div class="q-text">${session.variant === 'listen' ? '🔊 Nhấn loa để nghe' : esc(card.front)}</div>
      ${(session.variant === 'listen' || /[a-zA-Z]/.test(card.front)) ? `
      <button class="q-speak" id="speakBtn" title="Nghe" aria-label="Nghe">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 010 7.07"/></svg>
      </button>` : ''}
    </div>
    <div id="quizBody"></div>
  `;

  if (session.variant === 'listen') setTimeout(() => { speak(card.front); }, 400);
  const spb = $('#speakBtn');
  if (spb) spb.addEventListener('click', () => speak(card.front));

  const body = $('#quizBody');
  if (session.variant === 'mcq') renderMCQ(body, deck, card);
  else renderTypeInput(body, deck, card);

  startQuizTimer();
}

function startQuizTimer() {
  const el = $('#timerNum');
  const box = $('#quizTimer');
  if (!el) return;
  let t = session.timeLimit;
  el.textContent = t;
  box.classList.remove('warn');
  session.timer = setInterval(() => {
    t--;
    el.textContent = t;
    if (t <= 5) box.classList.add('warn');
    if (t <= 0) {
      clearInterval(session.timer);
      if (!session.answered) {
        if (session.variant === 'mcq') {
          const correctIdx = session.currentOptions?.correct;
          if (correctIdx !== undefined) selectMCQ(correctIdx, true);
        } else submitType(true);
      }
    }
  }, 1000);
}

function renderMCQ(body, deck, card) {
  const others = deck.cards.filter(c => c.id !== card.id && c.back !== card.back);
  const shuffled = others.sort(() => Math.random() - .5).slice(0, 3);
  const options = [card, ...shuffled].map(c => ({ id: c.id, text: c.back, correct: c.id === card.id }));
  options.sort(() => Math.random() - .5);
  const correctIdx = options.findIndex(o => o.correct);
  session.currentOptions = { options, correct: correctIdx };
  const keys = ['A', 'B', 'C', 'D'];

  body.innerHTML = `<div class="quiz-options">
    ${options.map((o, i) => `<button class="quiz-option" data-idx="${i}" type="button">
      <span class="key">${keys[i]}</span>
      <span>${esc(o.text)}</span>
    </button>`).join('')}
  </div>`;

  body.querySelectorAll('.quiz-option').forEach(btn => {
    btn.addEventListener('click', () => selectMCQ(+btn.dataset.idx, false));
  });
}

function selectMCQ(idx, timeout) {
  if (session.answered) return;
  session.answered = true;
  if (session.timer) clearInterval(session.timer);
  const opts = document.querySelectorAll('.quiz-option');
  opts.forEach((o, i) => {
    o.classList.add('disabled');
    if (i === session.currentOptions.correct) o.classList.add('correct');
    else if (i === idx && !timeout) o.classList.add('wrong');
    else o.classList.add('dim');
  });
  const correct = idx === session.currentOptions.correct;
  const deck = getDeck(session.deckId);
  const card = deck.cards.find(c => c.id === session.queue[session.index]);
  if (card) {
    card.reviewed = (card.reviewed || 0) + 1;
    card.lastReviewed = Date.now();
    if (correct) { card.level = Math.min(5, (card.level || 0) + 1); card.correct = (card.correct || 0) + 1; session.results.good++; beep(880, .09, 'triangle', .05); }
    else { card.level = Math.max(0, (card.level || 0) - 1); card.wrong = (card.wrong || 0) + 1; session.results.bad++; beep(220, .16, 'sawtooth', .04); }
    save();
  }
  if (timeout) toast('Hết giờ!', 'warn');
  setTimeout(() => { session.answered = false; session.index++; renderQuiz(); }, correct ? 900 : 1500);
}

function renderTypeInput(body, deck, card) {
  body.innerHTML = `
    <input type="text" class="type-input" id="typeInput" placeholder="Nhập đáp án..." autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
    <div id="typeFeedback"></div>
    <div style="display:flex;gap:10px;margin-top:14px">
      <button class="btn btn-ghost" id="skipBtn" type="button">Bỏ qua</button>
      <button class="btn btn-primary" id="submitBtn" type="button" style="flex:1">Kiểm tra</button>
    </div>
  `;
  const input = $('#typeInput');
  setTimeout(() => input.focus(), 120);

  input.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); submitType(false); } });
  $('#submitBtn').addEventListener('click', () => submitType(false));
  $('#skipBtn').addEventListener('click', () => {
    session.answered = true;
    if (session.timer) clearInterval(session.timer);
    input.classList.add('wrong');
    input.disabled = true;
    input.value = card.back;
    showTypeAnswer(card.back, false);
    const d = getDeck(session.deckId);
    const c = d.cards.find(x => x.id === card.id);
    if (c) { c.reviewed = (c.reviewed || 0) + 1; c.wrong = (c.wrong || 0) + 1; c.level = Math.max(0, (c.level || 0) - 1); save(); }
    session.results.bad++;
    setTimeout(() => { session.answered = false; session.index++; renderQuiz(); }, 1400);
  });
}

function submitType(timeout) {
  if (session.answered) return;
  session.answered = true;
  if (session.timer) clearInterval(session.timer);
  const input = $('#typeInput');
  const userAns = input ? input.value.trim() : '';
  const deck = getDeck(session.deckId);
  const card = deck.cards.find(c => c.id === session.queue[session.index]);
  if (!card) return;

  const norm = s => s.toLowerCase().trim().replace(/\s+/g, ' ').replace(/[.,;:!?]/g, '');
  const correct = !timeout && norm(userAns) === norm(card.back);

  if (input) {
    input.disabled = true;
    input.classList.add(correct ? 'correct' : 'wrong');
    if (!correct) input.value = userAns;
  }

  card.reviewed = (card.reviewed || 0) + 1;
  card.lastReviewed = Date.now();
  if (correct) { card.level = Math.min(5, (card.level || 0) + 1); card.correct = (card.correct || 0) + 1; session.results.good++; beep(880, .09, 'triangle', .05); }
  else { card.level = Math.max(0, (card.level || 0) - 1); card.wrong = (card.wrong || 0) + 1; session.results.bad++; beep(220, .16, 'sawtooth', .04); }
  save();

  showTypeAnswer(card.back, correct, userAns);
  if (timeout) toast('Hết giờ!', 'warn');

  setTimeout(() => { session.answered = false; session.index++; renderQuiz(); }, correct ? 1100 : 1900);
}

function showTypeAnswer(answer, correct, userAns) {
  const fb = $('#typeFeedback');
  if (!fb) return;
  if (!correct) {
    fb.innerHTML = `<div class="type-answer-box">
      <div class="lbl">ĐÁP ÁN ĐÚNG</div>
      <div style="font-weight:700;font-size:15px;white-space:pre-wrap">${esc(answer)}</div>
    </div>`;
  } else {
    fb.innerHTML = `<div class="type-answer-box" style="background:color-mix(in srgb,var(--success) 15%,var(--surface))">
      <div class="lbl">CHÍNH XÁC! ✓</div>
    </div>`;
  }
}

function exitQuiz() {
  const sid = session?.deckId;

}

        <button class="btn btn-ghost" onclick="exitQuiz()">Về bộ thẻ</button>
        <button class="btn btn-primary" id="againBtn">Chơi lại</button>

  if (pct >= 50) { setTimeout(() => burstConfetti(pct >= 90 ? 200 : 120), 380); chord([660, 880, 1100], .16, .09); }
  $('#againBtn').addEventListener('click', () => startQuiz(session.deckId, session.variant));
}

/* ============ MATCH GAME ============ */
function startMatch(deckId) {
  const deck = getDeck(deckId);
  if (!deck || deck.cards.length < 3) { toast('Cần ít nhất 3 thẻ!', 'warn'); return; }
  const pool = deck.cards.slice().sort(() => Math.random() - .5).slice(0, Math.min(deck.cards.length, 6));
  const left = pool.slice().sort(() => Math.random() - .5);
  const right = pool.slice().sort(() => Math.random() - .5);
  session = {
    mode: 'match', deckId, left, right,
    selectedLeft: null, selectedRight: null,
    matched: new Set(),
    results: { good: 0, bad: 0 },
    startTime: Date.now(), lock: false
  };
  go('match');
  renderMatch();
}

function renderMatch() {
  if (!session || session.mode !== 'match') return;
  const deck = getDeck(session.deckId);
  const wrap = $('#matchWrap');
  const total = session.left.length;
  const done = session.matched.size;

  if (done === total) { renderMatchResult(); return; }

  wrap.innerHTML = `
    <div class="quiz-head">
      <button class="icon-btn" onclick="exitMatch()" title="Thoát" aria-label="Thoát">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button>
      <span class="title">🧩 Ghép cặp · ${esc(deck.icon)} ${esc(deck.name)}</span>
      <span class="counter">${done} / ${total}</span>
    </div>
    <div class="study-progress"><div class="fill" style="width:${done / total * 100}%"></div></div>
    <div class="match-grid">
      <div class="match-col">
        ${session.left.map((c, i) => `<div class="match-item ${session.matched.has(c.id) ? 'matched' : ''}" data-side="l" data-id="${c.id}" style="--i:${i}">${esc(c.front)}</div>`).join('')}
      </div>
      <div class="match-col">
        ${session.right.map((c, i) => `<div class="match-item ${session.matched.has(c.id) ? 'matched' : ''}" data-side="r" data-id="${c.id}" style="--i:${i}">${esc(c.back)}</div>`).join('')}
      </div>
    </div>
    <div class="study-foot">
      <span>👆 Nhấn 1 ô trái, 1 ô phải để ghép</span>
      <span>❤️ ${session.results.good} · 💔 ${session.results.bad}</span>
    </div>
  `;

  wrap.querySelectorAll('.match-item').forEach(el => {
    el.addEventListener('click', () => handleMatchClick(el));
  });
}

function handleMatchClick(el) {
  if (!session || session.lock) return;
  if (el.classList.contains('matched')) return;
  const side = el.dataset.side;
  if (side === 'l') {
    document.querySelectorAll('.match-item[data-side="l"]').forEach(x => x.classList.remove('selected'));
    el.classList.add('selected');
    session.selectedLeft = el;
    beep(600, .06);
  } else {
    if (!session.selectedLeft) { beep(340, .08, 'sawtooth', .03); return; }
    document.querySelectorAll('.match-item[data-side="r"]').forEach(x => x.classList.remove('selected'));
    el.classList.add('selected');
    session.selectedRight = el;
    checkMatch();
  }
}

function checkMatch() {
  const l = session.selectedLeft, r = session.selectedRight;
  if (!l || !r) return;
  session.lock = true;
  const match = l.dataset.id === r.dataset.id;
  const deck = getDeck(session.deckId);
  if (match) {
    l.classList.remove('selected'); r.classList.remove('selected');
    l.classList.add('matched'); r.classList.add('matched');
    session.matched.add(l.dataset.id);
    session.results.good++;
    beep(880, .09, 'triangle', .05);
    const card = deck.cards.find(c => c.id === l.dataset.id);
    if (card) {
      card.reviewed = (card.reviewed || 0) + 1;
      card.lastReviewed = Date.now();
      card.level = Math.min(5, (card.level || 0) + 1);
      card.correct = (card.correct || 0) + 1;
      save();
    }
    session.selectedLeft = null; session.selectedRight = null;
    session.lock = false;
    renderMatch();
  } else {
    l.classList.add('wrong'); r.classList.add('wrong');
    beep(220, .16, 'sawtooth', .04);
    session.results.bad++;
    const card = deck.cards.find(c => c.id === l.dataset.id);
    if (card) {
      card.reviewed = (card.reviewed || 0) + 1;
      card.lastReviewed = Date.now();
      card.level = Math.max(0, (card.level || 0) - 1);
      card.wrong = (card.wrong || 0) + 1;
      save();
    }
    setTimeout(() => {
      l.classList.remove('wrong', 'selected');
      r.classList.remove('wrong', 'selected');
      session.selectedLeft = null; session.selectedRight = null;
      session.lock = false;
    }, 600);
  }
}

function exitMatch() {
  const sid = session?.deckId;
  session = null;
  if (sid && getDeck(sid)) { currentDeckId = sid; renderDeckDetail(); go('deck'); }

}

function startStudyMulti(items) {
  if (!items.length) return;
  const firstDeckId = items[0].deckId;
  const queue = items.map(x => ({ deckId: x.deckId, cardId: x.cardId }));
  session = {
    mode: 'study', multi: true, queue, index: 0, flipped: false,
    results: { good: 0, bad: 0 }, startTime: Date.now(), total: queue.length, deckId: firstDeckId
  };
  go('study');
  renderStudyMulti();
}

function renderStudyMulti() {
  if (!session || !session.multi) return;
  if (session.index >= session.queue.length) { renderResultMulti(); return; }
  const item = session.queue[session.index];
  const deck = getDeck(item.deckId);
  if (!deck) { session.index++; renderStudyMulti(); return; }
  const card = deck.cards.find(c => c.id === item.cardId);
  if (!card) { session.index++; renderStudyMulti(); return; }
  const pct = Math.round(session.index / session.total * 100);
  const wrap = $('#studyWrap');
  wrap.innerHTML = `

function rateStudyMulti(good) {
  if (!session || !session.flipped) return;
  const item = session.queue[session.index];
  const deck = getDeck(item.deckId);
  const card = deck.cards.find(c => c.id === item.cardId);
  if (card) {
    card.reviewed = (card.reviewed || 0) + 1;
    card.lastReviewed = Date.now();
    if (good) { card.level = Math.min(5, (card.level || 0) + 1); card.correct = (card.correct || 0) + 1; session.results.good++; beep(880, .09, 'triangle', .05); }
    else { card.level = Math.max(0, (card.level || 0) - 1); card.wrong = (card.wrong || 0) + 1; session.results.bad++; beep(220, .16, 'sawtooth', .04); }
  }
  save();
  session.flipped = false;
  session.index++;
  setTimeout(() => renderStudyMulti(), good ? 280 : 420);
}
